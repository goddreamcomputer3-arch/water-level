<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Water Tank Dashboard</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        /* --- Water Tank Visualizer --- */
        .tank-container {
            width: 140px;
            height: 250px;
            border: 4px solid #cfd8dc;
            border-radius: 15px 15px 5px 5px;
            margin: 0 auto 30px auto;
            position: relative;
            background-color: #fafafa;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            transition: all 0.3s ease; /* Smooth transition for gray-out */
        }
        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; 
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            transition: height 1s ease-in-out;
            border-top: 3px solid rgba(255, 255, 255, 0.4);
        }
        .water-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: bold;
            color: #333;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }

        /* --- Round Push Button --- */
        .motor-control {
            margin-top: 20px;
        }
        p.status-label {
            margin-bottom: 10px;
            color: #666;
            font-weight: 600;
        }
        .round-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            outline: none;
        }
        .round-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-off {
            background: radial-gradient(circle, #ff4b4b 0%, #d80000 100%);
        }
        .btn-on {
            background: radial-gradient(circle, #00d25b 0%, #009e44 100%);
        }
        
        /* --- NEW: OFFLINE DISABLED STYLES --- */
        .disabled-tank {
            filter: grayscale(100%);
            opacity: 0.6;
        }
        .disabled-btn {
            background: #cccccc !important; /* Forces gray background */
            color: #777777 !important;
            cursor: not-allowed !important;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1) !important;
            transform: none !important; /* Prevents clicking animation */
        }
        
        #connection-status {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h2>Water Level Monitor</h2>
        
        <div class="tank-container" id="tankVisual">
            <div class="water-text" id="waterPercentage">--%</div>
            <div class="water" id="waterLevel"></div>
        </div>

        <div class="motor-control">
            <p class="status-label">PUMP CONTROL</p>
            <button id="pumpBtn" class="round-btn btn-off" disabled>OFF</button>
        </div>
        
        <div id="connection-status">Connecting to Firebase...</div>
    </div>

    <script>
        // 1. YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyC9kSxaQFABWUXQloc9ezEvOUQ0FUIaN9E",
            databaseURL: "https://water-tank-27f20-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // 2. LOG IN
        const email = "waterlevel@gmail.com";
        const password = "#@12345";

        const statusText = document.getElementById('connection-status');
        const btn = document.getElementById('pumpBtn');
        const tank = document.getElementById('tankVisual');
        const waterText = document.getElementById('waterPercentage');

        // Master variables to store real states even when offline
        let isDeviceOnline = false;
        let lastKnownPumpState = false;
        let lastKnownLevel = 0;

        statusText.innerText = "⏳ Logging in...";

        auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                statusText.innerText = "⏳ Checking ESP32 Status...";
                startListening();
            })
            .catch((error) => {
                statusText.innerText = "🔴 Web Login Error";
                statusText.style.color = "red";
                console.error("Login Failed:", error);
            });

        function startListening() {
            let currentHeartbeat = -1;
            let lastHeartbeat = -1;

            // Listen for heartbeat
            database.ref('Tank/Heartbeat').on('value', (snapshot) => {
                currentHeartbeat = snapshot.val();
            });

            // --- HEARTBEAT MONITOR WITH UI LOCKING ---
            setInterval(() => {
                if (currentHeartbeat === lastHeartbeat) {
                    // ESP32 IS OFFLINE
                    isDeviceOnline = false;
                    statusText.innerText = "🔴 Device Offline";
                    statusText.style.color = "#ff4b4b";
                    
                    // Lock UI
                    btn.disabled = true;
                    btn.className = "round-btn disabled-btn";
                    btn.innerText = "OFFLINE";
                    
                    tank.classList.add('disabled-tank');
                    waterText.innerText = "N/A";
                    waterText.style.fontSize = "24px"; // Make text a bit smaller for "N/A"
                } else {
                    // ESP32 IS ONLINE
                    isDeviceOnline = true;
                    statusText.innerText = "🟢 Device Online & Active";
                    statusText.style.color = "#009e44";
                    
                    // Unlock UI
                    btn.disabled = false;
                    tank.classList.remove('disabled-tank');
                    waterText.style.fontSize = "30px";
                    
                    // Restore exact visual state
                    waterText.innerText = lastKnownLevel + '%';
                    if (lastKnownPumpState === true) {
                        btn.className = "round-btn btn-on";
                        btn.innerText = "ON";
                    } else {
                        btn.className = "round-btn btn-off";
                        btn.innerText = "OFF";
                    }
                }
                lastHeartbeat = currentHeartbeat;
            }, 6000); 

            // Listen for Water Level Changes
            database.ref('Tank/WaterLevel').on('value', (snapshot) => {
                let level = snapshot.val();
                if (level === null) level = 0;
                lastKnownLevel = level;
                
                document.getElementById('waterLevel').style.height = level + '%';
                if (isDeviceOnline) {
                    waterText.innerText = level + '%';
                }
            });

            // Listen for Pump Status Changes
            database.ref('Tank/PumpStatus').on('value', (snapshot) => {
                lastKnownPumpState = snapshot.val();
                
                if (isDeviceOnline) {
                    if (lastKnownPumpState === true) {
                        btn.className = "round-btn btn-on";
                        btn.innerText = "ON";
                    } else {
                        btn.className = "round-btn btn-off";
                        btn.innerText = "OFF";
                    }
                }
            });
        }

        // 3. SEND WEB COMMAND TO ESP32
        btn.addEventListener('click', () => {
            // Extra security: If device is offline, absolutely do not send the click
            if (!isDeviceOnline) return; 
            
            database.ref('Tank/WebCommandToggle').set(true);
        });
    </script>
</body>
</html>
